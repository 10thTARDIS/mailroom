name: Tag Provenance and Publish

# #356: a release pushes `refs/heads/main` and then `refs/tags/vX.Y.Z`. Until
# this workflow existed, BOTH ci.yml (`branches: [main]` plus `tags: ["v*"]`)
# and restore-drill.yml (a bare `push:`, which matches every ref) triggered on
# that tag push too — so every tagged merge ran the ~19-job CI matrix AND the
# weekly restore drill a SECOND time, against byte-identical code, because
# each workflow's concurrency group is keyed on github.ref and a tag is a
# different ref from main. Measured: four push-event runs per tagged merge
# (two CI, two restore-drill). On 0fb00dc (v1.64.1) the duplicate CI run went
# red on a flaky inline-images job while the FIRST run of that exact SHA was
# green — a false red on an already-released commit that could not have added
# any information (#432).
#
# Neither workflow ever did anything release-specific on the tag — no image
# publish, no artifact upload, no release notes — and branch protection only
# gates `main`, so the tag run's result gated nothing. ci.yml and
# restore-drill.yml no longer trigger on tags at all.
#
# ⚠ THE "no image publish" ABOVE DESCRIBES ci.yml AND restore-drill.yml, AND IS
# NO LONGER TRUE OF THIS FILE. Since #534 a second job here, publish-image,
# builds and pushes the release image — see its own comment for why it lives in
# this workflow rather than a separate one (short version: `needs` is what makes
# "published" mean "provenance proven"). The paragraph above is kept as written
# because it is the argument for the trigger removal, which still stands; this
# note is the amendment rather than a silent edit.
#
# What that removal loses: proof that a tag was actually cut from a commit
# that went through main's CI, rather than a stray local commit tagged and
# pushed without the matrix ever running on it. This workflow is that one
# cheap replacement — seconds, not minutes — instead of re-running everything:
#   1. the tagged commit must be reachable from origin/main (`git merge-base
#      --is-ancestor`), and
#   2. a push-triggered run of ci.yml for that EXACT commit SHA must have
#      already succeeded, per the Forgejo Actions API.
#
# It fails loudly, with a message describing the fix (run CI on a branch,
# merge it to main once green, THEN tag main's tip) rather than silently
# passing or silently skipping.
#
# ⚠ DO NOT ADD `tag-provenance` TO BRANCH PROTECTION'S REQUIRED STATUS CHECKS.
# This workflow only ever runs on a `vX.Y.Z` tag push. A required context that
# never reports a status on `main` or on PR branches wedges every unrelated PR
# forever — the exact trap #273 already found from the other direction (a
# required check that COULD skip on main). Keeping this in its own file, with
# its own trigger and its own concurrency group, is what keeps it from ever
# getting entangled with ci.yml's matrix or its required-context list.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tag-provenance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history AND every branch/tag ref — actions/checkout's own
          # documented meaning of fetch-depth: 0 — so `origin/main` resolves
          # locally for the merge-base check below. restore-drill.yml already
          # relies on this same fetch-depth: 0 + `origin/$DEFAULT_BRANCH`
          # shape for the same reason (its relevance filter, #236).
          fetch-depth: 0

      - name: The tagged commit must be reachable from main
        run: |
          set -eu
          if ! git rev-parse --verify -q origin/main >/dev/null 2>&1; then
            echo "::error::origin/main did not resolve after a full-history checkout — cannot verify provenance"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_SHA is not reachable from main."
            echo "This tag was cut from a commit that never went through main."
            echo "Push it as a branch, let CI go green, merge to main, THEN tag main's tip."
            exit 1
          fi
          echo "$GITHUB_SHA is reachable from main."

      # ⚠ THE AUTOMATIC TOKEN, NOT A REPOSITORY SECRET. Every Forgejo Actions
      # step already runs with a FORGEJO_TOKEN/GITHUB_TOKEN env var and a
      # matching github.token / forgejo.token context — "the unique
      # authentication token automatically created for [the] duration of the
      # workflow" (Forgejo Actions reference docs). It is what actions/checkout
      # already uses, in every job in both other workflows, to fetch this
      # repository; this step just reuses it to read the SAME repository's own
      # Actions API. Non-fork, non-pull_request runs (this is a tag push) get
      # the token's full default permissions, so no `permissions:` block is
      # needed — Forgejo Actions has no such key to grant one.
      - name: CI must have already succeeded for this exact commit
        env:
          FORGEJO_TOKEN: ${{ github.token }}
          FORGEJO_API_URL: ${{ github.api_url }}
          REPO: ${{ github.repository }}
        run: |
          set -eu
          # A push-triggered run is the ordinary evidence. A workflow_dispatch run of
          # the SAME workflow on the SAME commit is the same evidence: it exists so a
          # push run that a runner restart killed mid-flight (#502) can be re-run from
          # the API instead of a web-UI click, and the tag must not then be refused for
          # the event name on an otherwise identical green run. Nothing else counts — a
          # pull_request run tests a merge preview, not this commit.
          found=""
          for ev in push workflow_dispatch; do
            if ! resp=$(curl -sS -f \
              -H "Authorization: token $FORGEJO_TOKEN" \
              "$FORGEJO_API_URL/repos/$REPO/actions/runs?head_sha=$GITHUB_SHA&status=success&event=$ev&limit=50"); then
              echo "::error::could not query the Forgejo Actions API for $GITHUB_SHA's $ev runs"
              exit 1
            fi
            if printf '%s' "$resp" | grep -Eq '"workflow_id"[[:space:]]*:[[:space:]]*"[^"]*ci\.yml"'; then
              found="$ev"; break
            fi
          done
          if [ -z "$found" ]; then
            echo "::error::no successful push- or dispatch-triggered CI run found for $GITHUB_SHA"
            echo "This tag's commit never had a green CI run on main (or CI hasn't finished yet)."
            echo "Run CI on a branch, merge it to main once green, THEN tag main's tip — or"
            echo "dispatch ci.yml on this commit and let it go green."
            exit 1
          fi
          echo "a successful CI run ($found) exists for $GITHUB_SHA."

  # Publish the release image (#534). Lives HERE, needing tag-provenance, rather
  # than in a workflow of its own — and that placement is the whole design.
  #
  # ⚠ A SEPARATE TAG-TRIGGERED WORKFLOW WOULD PUBLISH AN IMAGE FOR A TAG WHOSE
  # PROVENANCE FAILED. The two would race on the same tag push with no ordering
  # between them, so a tag cut from a commit main's CI never saw could still
  # produce a registry image that looks exactly as official as any other. `needs`
  # is what makes "published" mean "provenance proven".
  #
  # This file's header says the tag runs did "no image publish" as part of the
  # argument for removing ci.yml's and restore-drill.yml's tag triggers. That is
  # now out of date by exactly this job, which is why the header was amended
  # rather than left to quietly mislead.
  #
  # ⚠ STILL DO NOT ADD THIS WORKFLOW TO BRANCH PROTECTION. It runs only on a
  # `v*` tag, so a required context from it would wedge every PR forever (#273).
  # Adding a job changes nothing about that.
  #
  # Until the REGISTRY_TOKEN secret exists this job SKIPS its push steps and
  # stays green, rather than turning every release red on a credential that
  # has not been created yet. It warns so the skip is visible.
  publish-image:
    needs: [tag-provenance]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Check publish preconditions
        id: creds
        run: |
          # Gate on BOTH the secret AND a trusted ref. `push` is already limited
          # to v* tags, but workflow_dispatch can be started from ANY ref —
          # without the ref guard, a dispatch from an untrusted branch could
          # publish, or exfiltrate the token. This is the standard guard for a
          # token-bearing publish step.
          TRUSTED=0
          case "${GITHUB_REF}" in refs/tags/v*) TRUSTED=1 ;; esac
          if [ -n "${{ secrets.REGISTRY_TOKEN }}" ] && [ "$TRUSTED" = "1" ]; then
            echo "have=1" >> "$GITHUB_OUTPUT"
          else
            echo "have=0" >> "$GITHUB_OUTPUT"
            [ "$TRUSTED" = "1" ] || echo "::warning::Ref ${GITHUB_REF} is not a v* tag - not publishing."
            [ -n "${{ secrets.REGISTRY_TOKEN }}" ] || echo "::warning::REGISTRY_TOKEN not set - skipping the image push. Create a repo Actions secret with write:package scope to activate publishing; no code change is needed."
          fi

      - name: Resolve version and image
        if: steps.creds.outputs.have == '1'
        id: meta
        env:
          SERVER_URL: ${{ github.server_url }}
          REPO: ${{ github.repository }}
        run: |
          # ⚠ THE REGISTRY HOST IS DERIVED, NEVER LITERAL. Writing a literal
          # forge hostname here would be a portability violation of exactly the
          # shape CLAUDE.md records as having happened once — a private
          # reference landing in a workflow file. And note it would NOT have
          # been caught locally: portability-check's in-tree layer inspects hosts
          # inside URLs, and a bare host in an image reference has no scheme, so
          # only the out-of-band denylist sees it. Deriving from the Actions
          # context is both portable and more correct: the image goes to the
          # registry of whichever Forgejo is running the job, under this repo.
          HOST="${SERVER_URL#https://}"
          HOST="${HOST#http://}"
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "host=$HOST" >> "$GITHUB_OUTPUT"
          echo "image=$HOST/$REPO" >> "$GITHUB_OUTPUT"
          echo "tag ${GITHUB_REF_NAME} -> version $VERSION, image $HOST/$REPO"

      - name: The tag must have a CHANGELOG entry
        if: steps.creds.outputs.have == '1'
        run: |
          # "A reader should be able to tell, from the tag plus the changelog,
          # exactly what a given deployed version contains" (CLAUDE.md). An image
          # published for a version the changelog never describes breaks that, and
          # it is the kind of omission nobody notices until they are trying to
          # find out what is running during an incident.
          V="${{ steps.meta.outputs.version }}"
          if ! grep -qF "## [$V]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [$V]' heading for tag ${GITHUB_REF_NAME}"
            echo "Rename the [Unreleased] section to [$V] before tagging."
            exit 1
          fi
          echo "CHANGELOG.md documents $V."

      - name: Registry login
        if: steps.creds.outputs.have == '1'
        env:
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
          ACTOR: ${{ github.repository_owner }}
        run: |
          # Host and user both derived, for the portability reason in the meta
          # step. The token goes in via stdin so it never appears in argv.
          printf '%s' "$REGISTRY_TOKEN" | docker login "${{ steps.meta.outputs.host }}" -u "$ACTOR" --password-stdin

      - name: Build the release image
        if: steps.creds.outputs.have == '1'
        run: |
          # ⚠ --build-arg MAILROOM_VERSION IS REQUIRED. Without it the binary
          # reports 0.0.0-dev and a running instance cannot say which release it
          # is (#134) — which is precisely what an image built by hand on the
          # host got wrong before this job existed.
          #
          # ⚠ --no-cache IS REQUIRED TOO. The runtime stage's `apk add` installs
          # whatever the Alpine mirror serves, and its layer is cached on the
          # runner for as long as the RUN line and the pinned base digest stay
          # the same. v1.81.1 shipped pcre2 10.48 that way, although the mirror
          # had served the fixed 10.49 for days and a clean build got it (#104).
          # A release image has to be built from the mirror as it is at release
          # time, never from an earlier build's layer.
          docker build --no-cache \
            --build-arg MAILROOM_VERSION="${{ steps.meta.outputs.version }}" \
            -t "${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}" .

      - name: The image must report the tagged version
        if: steps.creds.outputs.have == '1'
        run: |
          # Checked BEFORE the push, so a mis-stamped image is never published.
          # ⚠ Pass NO binary path: ENTRYPOINT is /mailroom and docker APPENDS
          # arguments, so naming the binary again yields argv
          # "/mailroom /mailroom --version" and the flag is missed.
          V="${{ steps.meta.outputs.version }}"
          GOT=$(docker run --rm "${{ steps.meta.outputs.image }}:$V" --version)
          echo "image reports: $GOT"
          case "$GOT" in
            *"$V"*) echo "version stamp matches the tag." ;;
            *) echo "::error::image reports '$GOT', which does not contain the tagged version '$V'"; exit 1 ;;
          esac

      - name: Push
        if: steps.creds.outputs.have == '1'
        run: |
          # ONE IMMUTABLE VERSION TAG, AND NO MOVING TAG, deliberately. Mailroom
          # is meant to be deployed by pinning an exact tag, because a pinned tag
          # makes the deployed version a reviewable line in version control. A
          # moving tag here would make the deployed version unreviewable and
          # un-rollback-able, which is the opposite of what a pinned deployment
          # needs.
          docker push "${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}"
          echo "published ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}"
