# SPDX-License-Identifier: AGPL-3.0-only
#
# freshclam configuration for Mailroom's signature-update sidecar (ADR-027, #394).
#
# ⚠ THIS FILE EXISTS BECAUSE OF A DEPLOY THAT CRASH-LOOPED, not because the
# image's own defaults are wrong. Measured on the test instance, 2026-09-01,
# with `cap_drop: ALL`:
#
#     ERROR: Failed to open log file /var/log/clamav/freshclam.log: Permission denied
#     ERROR: initialize: libfreshclam init failed.
#
# The cause is not obvious and is worth writing down. freshclam starts as root,
# and /var/log/clamav is owned by `clamav`, mode 0755. Root writing into a
# directory it does not own relies on CAP_DAC_OVERRIDE — which `cap_drop: ALL`
# removes. So the fix is a choice between granting DAC_OVERRIDE (which is
# "ignore file permissions entirely", in the one container on this host with
# outbound internet) and not writing a log file at all.
#
# Not writing one is also what ADR-027 §10c decided independently: detection and
# update records belong in the container's stdout, where Docker's json-file
# driver already rotates them (10m x 5, #351), rather than in a second log with
# its own lifetime and its own retention question. Omitting UpdateLogFile sends
# everything to stderr, which is exactly that.

# Log to stdout/stderr. ⚠ Do NOT add UpdateLogFile — see above; it reintroduces
# the crash-loop AND a second unrotated log.

DatabaseDirectory /var/lib/clamav
# ⚠ INERT SINCE #641, KEPT AS DOCUMENTATION. DatabaseOwner only does anything
# when freshclam starts as root and drops privilege — which is exactly the
# root-then-drop step deploy/compose.yml's clamav-signatures service no longer
# does (it runs AS clamav from the start, `user: clamav:clamav`), because that
# step is what could not write freshclam.dat on a brand-new, non-root-writable
# volume in the first place. freshclam silently skips the setuid/setgid dance
# when it is not root, so this line changes nothing today; it stays as a record
# of intent in case anything ever invokes freshclam here as root again.
DatabaseOwner clamav
DatabaseMirror database.clamav.net
ScriptedUpdates yes

# Stay in the foreground: this container's only job is freshclam, and a
# background daemon would exit the entrypoint and take the container with it.
# ⚠ compose.yml's command ALSO passes --foreground — redundant with the line
# above, kept because the compose file is the one place someone reads to see
# what actually runs, and it should not have to cross-reference this file too.
Foreground yes

# Twice a day. ⚠ ADR-027 §5c's re-scan tiers are predicated on the DB version
# MOVING — and the whole system fails OPEN if it silently stops (a scanner with
# stale signatures answers "clean" and looks healthy). The cadence is therefore
# a floor on freshness, not a bandwidth saving.
#
# ⚠ IN THE DEPLOYED STACK THIS LINE DOES NOT GOVERN; compose.yml's --checks=12
# DOES (#641). A command-line flag overrides the config file: that is how the
# image's stock /init, which passes `--checks="${FRESHCLAM_CHECKS:-1}"`, held
# this line to once a day on every deployment until #641. compose.yml now
# bypasses /init and passes --checks=12 itself, so `docker top` shows the
# number in force. The value here is kept equal for anyone who runs freshclam
# by hand; to change the cadence, change compose.yml.
Checks 12

# ⚠ NotifyClamd is deliberately ABSENT, and the image's default sets it. It
# would have this container poke clamd over a socket it does not mount and could
# not reach — clamd runs with network_mode: none in a different container, which
# is the entire point of the split (§10b). clamd re-reads its database on its
# own SelfCheck timer instead.
