# SPDX-License-Identifier: AGPL-3.0-only
#
# clamd configuration for Mailroom's sealed scanner sidecar (ADR-027, #394).
#
# ⚠ THIS FILE IS NOT OPTIONAL TUNING. Two of the settings below are the
# difference between a four-state verdict model and a three-state one that
# silently calls unopened files clean. Measured against clamav/clamav 1.5.4 on
# 2026-09-01, with both alerts at their defaults:
#
#     encrypted zip                  -> "stream: OK"
#     archive member over the limit  -> "stream: OK"
#
# That is a clean verdict on a file nothing looked inside, and it is exactly the
# evasion ADR-027 §5b describes: pad past a limit, or send an encrypted archive
# with the password in the message body. Commodity technique, not exotic.
#
# With AlertExceedsMax and AlertEncrypted enabled, the same files report:
#
#     encrypted zip                  -> "stream: Heuristics.Encrypted.Zip FOUND"
#     archive member over the limit  -> "stream: Heuristics.Limits.Exceeded.MaxFileSize FOUND"
#
# ⚠ Those arrive as DETECTIONS. internal/clamd maps the Heuristics.Encrypted.*
# and Heuristics.Limits.Exceeded.* families to `unknown`, NOT `flagged` — a
# naive integration quarantines every password-protected zip as malware.
# Changing this file without changing that mapping breaks one or the other.

# --- Where clamd listens ------------------------------------------------------

# ⚠ NOT /tmp/clamd.sock, which is the image's default. /tmp is a tmpfs in this
# deployment (compose.yml), so a socket there would be invisible to every other
# container — the scanner would look healthy and be unreachable.
LocalSocket /run/clamav/clamd.sock
# ⚠ 0666, and the VOLUME is the access control — not this mode. Measured: clamd
# runs as root in this image (its entrypoint chowns the database directory at
# startup and dies without CAP_CHOWN), so the socket lands root:root. The
# mailroom container runs as uid 100 and could not open a 0660 socket at all.
#
# The same reasoning as the crypto socket (#275), with the uid trick
# unavailable: what limits access is that exactly one other container mounts
# this volume. Nothing else on the host can see the socket to open it.
LocalSocketMode 0666

# No TCP listener. The container runs with network_mode: none so nothing could
# reach it anyway; this makes the absence explicit rather than incidental.
TCPSocket 0

Foreground yes
LogTime yes

# --- The settings that make `unknown` exist (ADR-027 §5a) ---------------------

AlertExceedsMax yes
AlertEncrypted yes
AlertEncryptedArchive yes
AlertEncryptedDoc yes

# --- Data at rest (ADR-027 §10c) ---------------------------------------------

# ⚠ clamd decompresses archive members to disk while scanning, and deletes
# rather than shreds them. TemporaryDirectory points at a tmpfs so those
# plaintext fragments never touch the host's storage.
TemporaryDirectory /tmp
LeaveTemporaryFiles no

DatabaseDirectory /var/lib/clamav

# --- Scan limits --------------------------------------------------------------

# ⚠ StreamMaxLength MUST match internal/clamd.MaxStreamBytes. Mismatch is safe
# in both directions but wasteful in one: if ours is lower, files clamd could
# have scanned become `unknown` unasked; if ours is higher, a wasted round trip
# ends in "INSTREAM size limit exceeded. ERROR", which maps to `unknown` anyway.
#
# ⚠ 100 MB is the OFFICIAL IMAGE'S default (clamconf reports 104857600), NOT
# the 25 MB in upstream's documentation. ADR-027 §2 and
# cmd/mailroom-admin/attachmentreport.go both said 25 MB and were BOTH wrong
# about a deployed daemon; both are corrected (the ADR in #394, the report's
# label in #421, which now renders the figure from its own constant rather than
# restating it). A documented default is not a measurement.
StreamMaxLength 100M

MaxFileSize 100M
MaxScanSize 400M
MaxRecursion 17
MaxFiles 10000

# Bail out rather than grind: a scan that runs forever is a hung ingest, and a
# hung scanner is strictly worse than a dead one because nothing records it.
MaxScanTime 120000
